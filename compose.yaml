services:
  db:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: director
      POSTGRES_USER: director
      POSTGRES_PASSWORD: director
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U director -d director"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://director:director@db:5432/director
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (min 32 chars) in your environment}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_WORKSPACE_ID: ${AI_WORKSPACE_ID:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-8000}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MEDIA_DIR: /app/media
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:3000/media}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      SIGNED_URL_TTL_SEC: ${SIGNED_URL_TTL_SEC:-3600}
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  media_data:
